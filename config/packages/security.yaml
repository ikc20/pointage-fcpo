security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|build)/
            security: false
        
        #  Firewall pour le login (public)
        login:
            pattern: ^/api/auth/login
            stateless: true
            security: false 
        
        #  Firewall pour l'API (JWT)
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
        
        #  Firewall principal pour le reste
        main:
            lazy: true
            provider: app_user_provider
            # Désactive le login par formulaire par défaut
            # form_login: ~

    # Règles d'accès
    access_control:
        # Routes publiques
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS } # si tu as une inscription
        - { path: ^/$, roles: PUBLIC_ACCESS } # page d'accueil si besoin
        
        # Routes protégées par JWT
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        
        # Routes admin
        - { path: ^/api/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10